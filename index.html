<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>seamless</title>
  <link rel="stylesheet" href="./css/globals.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.4/full/pyodide.js"></script>
</head>
<body>
  <h1>Test</h1>
  <input id="test1">
  <input id="test2">
  <button onclick="update()">Run</button>
  <p id="output"></p>
  <script type="text/javascript">
    async function main() {
      let pyodide = await loadPyodide();
      return pyodide;
    }
    let pyodideReadyPromise = main();

    async function update() {
      let pyodide = await pyodideReadyPromise;
      pyodide.runPython(`
        import js
        inp1 = js.document.getElementById("test1")
        inp2 = js.document.getElementById("test2")
        js.document.getElementById("output").innerHTML = int(inp1.value) + int(inp2.value)
      `);
    }
  </script>
  <!-- <script type="module" src="./js/test.mjs"></script> -->
</body>
</html>
