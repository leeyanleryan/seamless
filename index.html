<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>seamless</title>
  <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico?v=2">
  <link rel="stylesheet" href="./css/globals.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.4/full/pyodide.js"></script>
</head>
<body>
  <div class="main-body">
    <h1>seamless</h1>
    <hr>
    <h2>Data Setup</h2>
    <ul>
      <li>Default: 5 rows, 5 columns</li>
      <li>Minimum: 2 rows, 2 columns</li>
      <li>Maximum: 20 rows, 10 columns</li>
    </ul>
    <input id="num-rows" placeholder="Type number of rows...">
    <input id="num-cols" placeholder="Type number of columns...">
    <button id="generate-random-data">Generate random data</button>
    <div id="data" class="data">

    </div>
    <script>
      const defaultRows = 5;
      const defaultCols = 5;
      const dataMatrix = document.getElementById("data");
      const fragment = document.createDocumentFragment();
      for (let i = 0; i < defaultRows+1; i++) {
        for (let j = 0; j < defaultCols; j++) {
          if (i === 0) {
            const dataVariable = document.createElement("div");
            dataVariable.className = "data-variable";
            let dataVariableName = null;
            if (j < defaultCols-1) {
              dataVariableName = "X" + String(j);
            } else {
              dataVariableName = "y";
            }
            dataVariable.id = dataVariableName;
            dataVariable.innerHTML = dataVariableName;
            fragment.appendChild(dataVariable);
          } else {
            const dataCell = document.createElement("input");
            dataCell.className = "data-cell";
            dataCell.id = "r" + String(i+1) + "-" + "c" + String(j+1);
            fragment.appendChild(dataCell);
          }
          
        }
      }
      dataMatrix.appendChild(fragment);
    </script>
    <div class="footer">
      <hr>
      <p>Source code: <a href="https://github.com/leeyanleryan/seamless" title="Source Code">GitHub</a></p>
      <p>Flaticon attribution: <a href="https://www.flaticon.com/free-icons/machine-learning" title="machine learning icons">Machine learning icons created by Smashicons - Flaticon</a></p>
    </div>
  </div>
  <script type="module" src="./js/pyodide.mjs"></script>
</body>
</html>
