<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>seamless</title>
  <link rel="icon" type="image/x-icon" href="./favicon/favicon.ico?v=2">
  <link rel="stylesheet" href="./css/globals.css">
  <script src="https://cdn.jsdelivr.net/pyodide/v314.0.4/full/pyodide.js"></script>
</head>
<body>
  <div class="main-body">
    <h1>seamless</h1>
    <hr>
    <h2>Data Setup</h2>
    <ul>
      <li>Default: 5 rows, 5 columns</li>
      <li>Minimum: 2 rows, 2 columns</li>
      <li>Maximum: 20 rows, 10 columns</li>
    </ul>
    <div class="generate-data-div">
      <input id="num-rows" placeholder="Number of rows...">
      <input id="num-cols" placeholder="Number of columns...">
      <button id="generate-random-data">Generate random data</button>
    </div>
    <div id="data" class="data"></div>
    <script src="./js/data_generator.js"></script>
    <div class="footer">
      <hr>
      <p>Source code: <a href="https://github.com/leeyanleryan/seamless" title="Source code" target="_blank">GitHub</a></p>
      <p>References: 
        <a href="https://scikit-learn.org/stable/" title="scikit-learn" target="_blank">scikit-learn</a>, 
        <a href="https://pyodide.org/en/stable/" title="Pyodide" target="_blank">Pyodide</a>, 
        <a href="https://www.w3schools.com/" title="w3schools" target="_blank">w3schools</a>
      </p>
      <p>Attribution: <a href="https://www.flaticon.com/free-icons/machine-learning" title="machine learning icons" target="_blank">Machine learning icons created by Smashicons - Flaticon</a></p>
    </div>
  </div>
  <script type="module" src="./js/pyodide.mjs"></script>
</body>
</html>
